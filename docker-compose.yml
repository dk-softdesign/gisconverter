# Deploy to a Docker Swarm with:
#   docker stack deploy -c docker-compose.yml gisconverter
#
# Build/push the image first (see Makefile: `make push`), or override the
# image via `IMAGE=... docker stack deploy -c docker-compose.yml gisconverter`.

services:
  app:
    image: ${IMAGE:-dockerrepo.softdesign.dk:5000/gisconverter:latest}
    ports:
      - "6228:3000"
    # Read from the deploying shell, e.g. `ANTHROPIC_API_KEY=... docker stack deploy ...`.
    # Without it the app still runs; only the "Ask Claude" helpers are disabled.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Members and sessions (SQLite). Keep this volume — losing it means
    # setting up the first admin again.
    volumes:
      - gisconverter-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      # Keep at 1: members/sessions live in SQLite on a node-local volume, and
      # login throttling is in memory. If the swarm has several nodes, pin the
      # service to one (placement constraint) so it always finds its volume.
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

volumes:
  gisconverter-data:
